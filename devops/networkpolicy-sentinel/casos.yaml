- vars:
    manifesto_permissivo: "# manifesto barrado pela revisão de segurança — permissivo demais\napiVersion: networking.k8s.io/v1\n\
      kind: NetworkPolicy\nmetadata:\n  name: sentinel-allow\n  namespace: sentinel-prod\nspec:\n  podSelector:\
      \ {}          # aplica a todos os pods do namespace\n  policyTypes:\n    - Ingress\n    - Egress\n  ingress:\n\
      \    - {}                   # libera QUALQUER origem\n  egress:\n    - {}                   # libera QUALQUER\
      \ destino"
    regras_seguranca: "NetworkPolicy para o namespace \"sentinel-prod\":\n- pods do Sentinel só aceitam tráfego\
      \ de entrada do Relay (consumo de\n  eventos) e do gateway de API da plataforma\n- pods do Sentinel só fazem\
      \ saída para: Forge (warehouse, porta 5432),\n  Cerebro (busca, porta 9200) e DNS interno\n- nada de \"allow\
      \ all\" em ingress ou egress\n- política default-deny explícita no namespace\n- toda regra precisa de comentário\
      \ dizendo qual fluxo legítimo ela libera"
    mapa_servicos: 'Sentinel     → namespace sentinel-prod, pods com label app=sentinel

      Relay        → namespace relay-prod,    pods com label app=relay

      API gateway  → namespace edge,          pods com label app=api-gateway

      Forge        → namespace forge-prod,    pods com label app=forge,   porta 5432 (Postgres do warehouse)

      Cerebro      → namespace cerebro-prod,  pods com label app=cerebro, porta 9200 (Elasticsearch)

      DNS interno  → namespace kube-system,   pods com label k8s-app=kube-dns, porta 53'
